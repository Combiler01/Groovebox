[package]
name = "grove"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.17"
eframe = "0.37.0"
image = "0.25.10"
lofty = "0.25.5"
rfd = "0.18.0"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-all"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wgpu = { version = "30.0.2", default-features = false, features = ["dx12", "gles", "std"] }
